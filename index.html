<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CAT Quants Companion | Arun Sharma Solutions</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css?v=2.0">
</head>
<body>
    <div class="app-container">
        <!-- Sidebar with Question List -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <h1>CAT Quants</h1>
                <p>Arun Sharma Solutions</p>
            </div>
            <div class="problem-list" id="problem-list">
                <!-- Populated dynamically by app.js -->
            </div>
        </aside>

        <!-- Main Content Area -->
        <main class="main-content">
            <header class="main-header">
                <span class="curr-question-title" id="curr-question-title">Select a Question</span>
                <button class="theme-toggle" id="theme-toggle" title="Toggle Theme">🌓</button>
            </header>
            
            <div id="solution-view" class="solution-view">
                <!-- Populated dynamically by app.js -->
                <div class="empty-state">
                    <p>Select a question from the sidebar to view the step-by-step solutions.</p>
                </div>
            </div>
        </main>
    </div>

    <script src="percentages-lod1-data.js?v=2.0"></script>
    <script src="app.js?v=2.0"></script>
</body>
</html>
